data:
  symbols: ['^DJI', '^DJT', '^GSPC', '^IXIC', 'SPY', 'IYT']
  exchange_map:
    '^DJI': INDEX
    '^DJT': INDEX
    '^GSPC': INDEX
    '^IXIC': INDEX
    SPY: NYSEARCA
    IYT: NYSEARCA
  interval: 1d
  stale_business_days: 5
  max_gap_business_days: 4
swings:
  method: pct
  minor_pct: 0.03
  secondary_pct: 0.10
  atr_window: 14
  atr_mult: 2.0
  pivot_n: 5
  secondary_min_days: 21
  secondary_max_days: 90
  schannep_min_days: 8
  schannep_min_pct: 0.03
trend:
  require_lower_high_for_reversal: true
line:
  band_pct: 0.05
  min_days: 14
confirmation:
  max_days: null
levels:
  tol_mode: pct
  tol_pct: 0.0075
  tol_atr_mult: 0.5
  min_touches: 2
  max_levels: 4
  trendline_tol_pct: 0.01
backtest:
  min_n: 30
  bootstrap_iter: 2000
  block_len: 20
  horizons_days: [20, 60, 120]
  alpha: 0.05
