[project]
name = "dowtheory"
version = "0.1.0"
description = "Dow Theory distilled into a Claude Code agent and skills: swing detection, three-trend classification, defense line, support/resistance, two-average confirmation, rule-level backtests."
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.7.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dow = "dowtheory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dowtheory"]

[tool.pytest.ini_options]
testpaths = ["tests", ".claude/skills"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
